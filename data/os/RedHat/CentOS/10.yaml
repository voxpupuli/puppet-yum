  # CentOS Stream has no minor release and uses the rolling EPEL 10 repositories.
  epel:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}&arch=$basearch"

  epel-debuginfo:
