---
yum::os_default_repos:
  - baseos
  - baseos-debuginfo
  - baseos-source
  - appstream
  - appstream-debuginfo
  - appstream-source
  - crb
  - crb-debuginfo
  - crb-source
  - highavailability
  - highavailability-debuginfo
  - highavailability-source
  - nfv
  - nfv-debuginfo
  - nfv-source
  - rt
  - rt-debuginfo
  - rt-source
  - resilientstorage
  - resilientstorage-debuginfo
  - resilientstorage-source
  - extras-common
  - extras-common-source

yum::repos:
  baseos:
    enabled: true
    descr: 'CentOS Stream $releasever - BaseOS'
    metalink: "https://mirrors.centos.org/metalink?repo=centos-baseos-$stream&arch=$basearch&protocol=https,http"
    metadata_expire: 6h
    gpgcheck: true
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial-SHA256"
    target: '/etc/yum.repos.d/centos.repo'

  baseos-debuginfo:
    enabled: false
    descr: 'CentOS Stream $releasever - BaseOS - Debug'
    metalink: "https://mirrors.centos.org/metalink?repo=centos-baseos-debug-$stream&arch=$basearch&protocol=https,http"
    metadata_expire: 6h
    gpgcheck: true
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial-SHA256"
    target: '/etc/yum.repos.d/centos.repo'

  baseos-source:
    enabled: false
    descr: 'CentOS Stream $releasever - BaseOS - Source'
    metalink: "https://mirrors.centos.org/metalink?repo=centos-baseos-source-$stream&arch=source&protocol=https,http"
    metadata_expire: 6h
    gpgcheck: true
    gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial-SHA256"
    target: '/etc/yum.repos.d/centos.repo'

  appstream:
