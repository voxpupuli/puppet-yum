---
# EPEL 10 metalinks only accept epel-testing-10, not the testing-epel10 used in repos.yaml.
yum::repos:
  epel-testing:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}&arch=$basearch"

  epel-testing-debuginfo:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}&arch=$basearch"

  epel-testing-source:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}&arch=source"
