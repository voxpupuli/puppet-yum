---
# EPEL 10 is published per minor release; os.release.minor is used because not
# every derivative (e.g. Oracle Linux) defines dnf's $releasever_minor.
yum::repos:
  epel:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}.%{facts.os.release.minor}&arch=$basearch"

  epel-debuginfo:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}.%{facts.os.release.minor}&arch=$basearch"

  epel-source:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}.%{facts.os.release.minor}&arch=source"

  epel-testing:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}.%{facts.os.release.minor}&arch=$basearch"

  epel-testing-debuginfo:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}.%{facts.os.release.minor}&arch=$basearch"

  epel-testing-source:
    metalink: "https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}.%{facts.os.release.minor}&arch=source"
